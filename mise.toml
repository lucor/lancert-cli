[tools]
go = "1.26"
goreleaser = "latest"

[tasks.setup]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.race]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run Go static checks"
run = [
  "go vet ./...",
  "go tool staticcheck ./...",
]

[tasks.vuln]
description = "Run the Go vulnerability check"
run = "go tool govulncheck ./..."

[tasks.build]
description = "Build the lancert binary"
run = "mkdir -p ./bin && go build -trimpath -o ./bin/lancert ./cmd/lancert"

[tasks.check]
description = "Run routine validation"
depends = ["fmt", "lint", "test", "build"]

[tasks.release-check]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks.release-snapshot]
description = "Build release artifacts without publishing"
run = "goreleaser release --snapshot --clean"
