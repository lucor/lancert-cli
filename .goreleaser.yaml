version: 2

project_name: lancert

before:
  hooks:
    - go test ./...

builds:
  - id: lancert
    main: ./cmd/lancert
    binary: lancert
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X go.lucor.dev/lancert-cli/internal/cli.Version={{.Version}}

archives:
  - id: lancert
    ids:
      - lancert
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: git

homebrew_casks:
  - name: lancert
    binaries:
      - lancert
    homepage: https://lancert.dev/
    description: Local HTTPS certificates for private IP addresses
    repository:
      owner: lucor
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lancert"]
          end
